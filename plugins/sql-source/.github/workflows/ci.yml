name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Andarius/trame
          path: trame

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trame-sql-source

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: trame/app/web/package-lock.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Rust toolchain and PostgreSQL runtime libraries
        run: |
          cd trame && rustup toolchain install
          sudo apt-get update
          sudo apt-get install -y libicu74 liburing2 libnuma1 libxml2 libldap2 libpam0g libzstd1 liblz4-1 libpq5

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: trame

      - name: Compose the plugin into Trame
        run: |
          echo '{ "plugins": ["../trame-sql-source"] }' > trame/plugins.local.json
          cd trame && bun install --frozen-lockfile && (cd app/web && npm ci) && bun scripts/gen-plugins.ts
          bash scripts/rust-package.sh prepare

      - name: Backend under Trame's lints, unit and integration tests
        env:
          TRAME_ISOLATED: "1"
          TRAME_OFFLINE: "1"
          TRAME_LOCAL_DIR: ${{ github.workspace }}/trame/.scratch/test
          TRAME_PG_BIN: ${{ github.workspace }}/trame/.scratch/package/pg/usr/lib/postgresql/18/bin
        run: |
          cd trame
          cargo clippy -p trame-local --all-targets --locked -- -D warnings
          cargo test -p trame-local --locked --lib local_gen::
          cargo test -p trame-local --locked --test 'plugin_sql_source_*'

      - name: Formatting, lint and bun tests (just lint)
        run: |
          cd trame-sql-source
          rustfmt --edition 2024 --check src/mod.rs tests/*.rs
          ../trame/node_modules/.bin/oxlint -c ../trame/.oxlintrc.json web
          bun test _test

      - name: Web typecheck
        run: cd trame/app/web && npm run typecheck
